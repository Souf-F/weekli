# Mises a jour automatiques des dependances, en particulier les correctifs de securite
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Delai avant d'adopter une nouvelle version : laisse le temps de reperer un paquet compromis
    # (les correctifs de securite ne sont pas retardes)
    cooldown:
      default-days: 7
    groups:
      dependances:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
