name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aucun secret dans le depot
        run: node scripts/verifier-secrets.mjs --tout
      - name: Aucune dependance vulnerable
        run: npm audit --audit-level=moderate
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build du front
        run: npm run build
