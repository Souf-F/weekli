name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push annule l'execution precedente de la meme branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aucun secret dans le depot
        run: node scripts/verifier-secrets.mjs --tout
      - name: Aucune dependance vulnerable
        run: npm audit --audit-level=moderate
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build du front
        run: npm run build
