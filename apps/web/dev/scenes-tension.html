<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex" />
	<title>Scènes de tension</title>
	<link rel="stylesheet" href="/src/styles/fonts.css" />
	<link rel="stylesheet" href="/dev/scenes-tension.css" />
</head>
<body>
	<main>
		<h1>Scènes de tension et de révélation (F6, développement)</h1>
		<p id="infos">Chargement des polices</p>
		<div class="duo">
			<figure>
				<video id="reference" muted playsinline preload="auto" aria-label="Vidéo de référence"></video>
				<figcaption>Référence (charger la vidéo ci-dessous)</figcaption>
			</figure>
			<figure>
				<canvas id="apercu" aria-label="Rendu des scènes au même instant"></canvas>
				<figcaption>Rendu Weekli, même instant</figcaption>
			</figure>
		</div>
		<div class="barre">
			<button id="lecture" type="button" disabled>Lecture</button>
			<input id="curseur" type="range" min="0" max="1" step="0.0333" value="0" aria-label="Position" />
			<span id="temps">0.00 s</span>
		</div>
		<div class="barre">
			<label>Vidéo de référence <input id="fichier" type="file" accept="video/mp4,video/webm" /></label>
			<label><input id="long" type="checkbox" /> Textes longs (réduction à 80 %)</label>
			<label><input id="logo" type="checkbox" /> Logo importé</label>
		</div>
		<div class="barre" id="instants" aria-label="Instants comparés"></div>
		<div class="barre">
			<button id="mesurer" type="button" disabled>Mesurer le dessin (1920x1080)</button>
			<button id="coupes" type="button" disabled>Chercher les textes coupés</button>
		</div>
		<p id="etat" role="status"></p>
		<table id="mesures" hidden>
			<caption>Temps de dessin par image, 1920x1080</caption>
			<thead><tr><th scope="col">Scène</th><th scope="col">Moyenne (ms)</th><th scope="col">p95 (ms)</th><th scope="col">Max (ms)</th></tr></thead>
			<tbody></tbody>
		</table>
	</main>
	<script type="module" src="/dev/scenes-tension.ts"></script>
</body>
</html>
